[tool.poetry]
name = "digital-twin-app"
version = "1.0.0"
description = "Streamlit dashboard for Digital Twin monitoring and visualization"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "digital_twin_app", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.11"
streamlit = "^1.28.0"
requests = "^2.31.0"
pandas = "^2.1.0"
numpy = "^1.26.0"
tenacity = "^9.1.4"
pybreaker = "^1.4.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.10.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"
