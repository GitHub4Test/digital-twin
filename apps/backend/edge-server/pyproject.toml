[tool.poetry]
name = "edge-server"
version = "0.2.1"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "edge_server" }
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = "^2.32.5"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.10.0"
flake8 = "^6.1.0"
pre-commit = "^4.0.0"
ruff = "^0.16.2"
pylint = "^4.0.7"
isort = "^8.0.1"


[tool.poetry.group.security.dependencies]
semgrep = "^1.163.0"
pip-audit = "^2.10.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pylint.messages_control]
disable = [
    "W1203",
    "C0114",
    "C0115",
    "C0116",
    "C0301",
]

[tool.ruff]
line-length = 100