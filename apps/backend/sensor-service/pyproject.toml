[tool.poetry]
name = "sensor-service"
version = "1.0.0"
description = "Backend sensor service for handling edge server connection and sensor data management in DB"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "sensor_service"}
]
include = [
    { path = "sensor_service/generated/**/*.py", format = ["sdist", "wheel"] }
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0.0"
fastapi = "^0.136.3"
uvicorn = {version = ">=0.31.1,<1.0.0", extras = ["standard"]}
pydantic = "^2.5.0"
aio-pika = "^9.6.2"
tenacity = "^9.1.4"
pybreaker = "^1.4.1"
starlette = "^1.1.0"
h11 = "0.16.0"
grpcio = "^1.83.0"
protobuf = ">=5,<7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.10.0"
flake8 = "^6.1.0"
httpx = "^0.28.0"
pre-commit = "^4.0.0"
pylint = "^4.0.7"
isort = "^8.0.1"
ruff = "^0.16.2"


[tool.poetry.group.security.dependencies]
pip-audit = "^2.10.0"
semgrep = "^1.163.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pylint.main]
ignore-paths = [
    "sensor_service/generated/.*"
]

[tool.pylint.messages_control]
disable = [
    "W1203",
    "C0114",
    "C0115",
    "C0116",
    "C0301",
]