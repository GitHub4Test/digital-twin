[tool.poetry]
name = "api-service"
version = "1.0.3"
description = "Api management backend service for Digital Twin sensor data management"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "api_service", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0.0"
fastapi = "^0.136.3"
uvicorn = {version = ">=0.31.1,<1.0.0", extras = ["standard"]}
pydantic = "^2.5.0"
aio-pika = "^9.6.2"
tenacity = "^9.1.4"
pybreaker = "^1.4.1"
starlette = "^1.1.0"
h11 = "0.16.0"
sqlalchemy = "^2.0.51"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.10.0"
flake8 = "^6.1.0"
httpx = "^0.28.0"
pre-commit = "^4.0.0"


[tool.poetry.group.security.dependencies]
pip-audit = "^2.10.0"
semgrep = "^1.163.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"