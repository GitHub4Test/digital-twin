frontend:
  replicaCount: 1
  containers:
    app:
      image: ""
      tag: 1.0.2
  service:
    type: TCP
    port: 8501
    nodeport: 30070
  resources:
    requests:
      memory: "256Mi"
      cpu: "125m"
    limits:
      memory: "528Mi"
      cpu: "250m"
  ingress:
    enabled: true
    host: dt-frontend.local
    annotations:
      kubernetes.io/ingress.class: traefik
    tls: []
    namespace: default

backend:
  replicaCount: 1
  containers:
    api_gateway:
      image: ""
      tag: 1.0.2
    edge_server:
      image: ""
      tag: 0.2.0
  service:
    type: TCP
    port: 8000
  resources:
    requests:
      memory: "128Mi"
      cpu: "125m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  readinessProbe:
    httpGet:
      path: /api/v1/ready
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /api/v1/live
    initialDelaySeconds: 10
    periodSeconds: 20
    failureThreshold: 3

ecr_setup:
  enabled: false
  imagePullSecretName: ecr-secret
  