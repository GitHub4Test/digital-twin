apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-backend"
  labels:
    app: "{{ .Release.Name }}-backend"
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-backend"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-backend"
    spec:
{{- if .Values.ecr_setup.enabled }}
      imagePullSecrets:
        - name: {{ .Values.ecr_setup.imagePullSecretName | quote }}
{{- end }}
      # nodeSelector:
      #   kubernetes.io/hostname: k3d-dev-cluster-server-0
      containers:
        - name: backend-api-service
          image: "{{ .Values.backend.containers.api_service.image }}:{{ .Values.backend.containers.api_service.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          command: ["uvicorn", "api_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: DB_PATH
              value: /data/database.db
            - name: RABBITMQ_HOST
              value: rabbitmq.messaging.svc.cluster.local
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: admin
            - name: RABBITMQ_PASSWORD
              value: admin
            - name: RABBITMQ_QUEUE_SENSOR
              value: sensor.readings
          resources:
            requests:
              memory: {{ .Values.backend.resources.requests.memory }}
              cpu: {{ .Values.backend.resources.requests.cpu }}
            limits:
              memory: {{ .Values.backend.resources.limits.memory }}
              cpu: {{ .Values.backend.resources.limits.cpu }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.readinessProbe.httpGet.path }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.backend.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.livenessProbe.httpGet.path }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.backend.livenessProbe.failureThreshold }}
          volumeMounts:
            - name: database-data
              mountPath: /data
        - name: backend-sensor-consumer
          image: "{{ .Values.backend.containers.api_service.image }}:{{ .Values.backend.containers.api_service.tag }}"
          imagePullPolicy: Always
          command: ["python", "-m", "api_service.rabbitmq.consumer"]
          env:
            - name: DB_PATH
              value: /data/database.db
            - name: RABBITMQ_HOST
              value: rabbitmq.messaging.svc.cluster.local
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: admin
            - name: RABBITMQ_PASSWORD
              value: admin
            - name: RABBITMQ_QUEUE_SENSOR
              value: sensor.readings
          resources:
            requests:
              memory: {{ .Values.backend.resources.requests.memory }}
              cpu: {{ .Values.backend.resources.requests.cpu }}
            limits:
              memory: {{ .Values.backend.resources.limits.memory }}
              cpu: {{ .Values.backend.resources.limits.cpu }}
          volumeMounts:
            - name: database-data
              mountPath: /data
        - name: backend-outbox-publisher
          image: "{{ .Values.backend.containers.api_service.image }}:{{ .Values.backend.containers.api_service.tag }}"
          imagePullPolicy: Always
          command: ["python", "-m", "api_service.rabbitmq.publisher"]
          env:
            - name: DB_PATH
              value: /data/database.db
            - name: RABBITMQ_HOST
              value: rabbitmq.messaging.svc.cluster.local
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: admin
            - name: RABBITMQ_PASSWORD
              value: admin
            - name: RABBITMQ_QUEUE_SENSOR
              value: sensor.readings
          resources:
            requests:
              memory: {{ .Values.backend.resources.requests.memory }}
              cpu: {{ .Values.backend.resources.requests.cpu }}
            limits:
              memory: {{ .Values.backend.resources.limits.memory }}
              cpu: {{ .Values.backend.resources.limits.cpu }}
          volumeMounts:
            - name: database-data
              mountPath: /data
        - name: backend-edge-server
          image: "{{ .Values.backend.containers.edge_server.image }}:{{ .Values.backend.containers.edge_server.tag }}"
          imagePullPolicy: Always
          env:
            - name: BACKEND_API_URL
              value: http://localhost:8000/api/v1/readings/event
          resources:
            requests:
              memory: {{ .Values.backend.resources.requests.memory }}
              cpu: {{ .Values.backend.resources.requests.cpu }}
            limits:
              memory: {{ .Values.backend.resources.limits.memory }}
              cpu: {{ .Values.backend.resources.limits.cpu }}
      volumes:
        - name: database-data
          emptyDir: {}
