---

- name: Run Docker containers
  ansible.builtin.shell:
    cmd: cd "{{ frontend_service_path }}" && docker compose up -d

- name: Create systemd service file for digital-twin
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/digital-twin.service.j2"
    dest: /etc/systemd/system/digital-twin-frontend.service
    owner: root
    group: root
    mode: '0644'
  when: ansible_facts['os_family'] != "Darwin"

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  when: ansible_facts['os_family'] != "Darwin"

- name: Enable digital-twin-frontend service
  ansible.builtin.systemd:
    name: digital-twin-frontend
    enabled: true
    state: started
  when: ansible_facts['os_family'] != "Darwin"  

- name: Create launchd service file for digital-twin-frontend
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/digital-twin.service-mac.j2"
    dest: /Library/LaunchDaemons/com.digital-twin-frontend.docker.plist
  become: true
  when: ansible_facts['os_family'] == "Darwin"

- name: Load launchd service
  command: launchctl load /Library/LaunchDaemons/com.digital-twin-frontend.docker.plist
  become: true
  when: ansible_facts['os_family'] == "Darwin"

- name: Display deployment status
  ansible.builtin.debug:
    msg:
      - "Frontend services deployed successfully!"
      - "Docker service: active and running"
      - "Digital Twin services: managed by systemd"
      - "Monitor status: systemctl status digital-twin"
      - "View logs: journalctl -u digital-twin -f"
