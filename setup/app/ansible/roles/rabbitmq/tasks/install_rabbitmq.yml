---

- name: Ensure RabbitMQ namespace exists
  ansible.builtin.command:
    cmd: kubectl create namespace {{ rabbitmq_namespace }}
  register: ns_result
  failed_when: ns_result.rc != 0 and 'AlreadyExists' not in ns_result.stderr
  changed_when: "'created' in ns_result.stdout"

- name: Add Bitnami Helm repo
  ansible.builtin.command:
    cmd: helm repo add bitnami https://charts.bitnami.com/bitnami
  register: helm_repo
  changed_when: "'has been added' in helm_repo.stdout"

- name: Update Helm repos
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

- name: Create RabbitMQ values file
  ansible.builtin.template:
    src: values.yml.j2
    dest: /tmp/rabbitmq-values.yml
    mode: "0600"

- name: Install or upgrade RabbitMQ
  ansible.builtin.command:
    cmd: >
      helm upgrade --install {{ rabbitmq_release_name }} {{ rabbitmq_chart_name }}
      --namespace {{ rabbitmq_namespace }}
      --values {{ rabbitmq_values_file }}
  register: rabbitmq_install
  changed_when: "'deployed' in rabbitmq_install.stdout or 'upgraded' in rabbitmq_install.stdout"

- name: Wait for RabbitMQ pod
  ansible.builtin.command:
    cmd: kubectl rollout status statefulset/{{ rabbitmq_release_name }} -n {{ rabbitmq_namespace }} --timeout=500s
  changed_when: false

- name: Ensure RabbitMQ Helm chart directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - "{{ rabbitmq_config_dir }}/helm_chart/templates"
    - "{{ rabbitmq_cert_dir }}"

- name: Create RabbitMQ Helm Chart.yaml
  become: true
  ansible.builtin.copy:
    dest: "{{ rabbitmq_config_dir }}/helm_chart/Chart.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    content: |
      apiVersion: v2
      name: rabbitmq-ingress
      description: RabbitMQ ingress resources
      type: application
      version: 0.1.0
      appVersion: "1.0"

- name: Generate RabbitMQ local TLS certificate
  become: true
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -days 365
      -newkey rsa:2048
      -keyout {{ rabbitmq_cert_dir }}/{{ rabbitmq_host }}.key
      -out {{ rabbitmq_cert_dir }}/{{ rabbitmq_host }}.crt
      -subj "/CN={{ rabbitmq_host }}"
      -addext "subjectAltName=DNS:{{ rabbitmq_host }}"
    creates: "{{ rabbitmq_cert_dir }}/{{ rabbitmq_host }}.crt"

- name: Fix RabbitMQ certificate permissions
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ rabbitmq_cert_dir }}/{{ rabbitmq_host }}.crt"
      mode: "0644"
    - path: "{{ rabbitmq_cert_dir }}/{{ rabbitmq_host }}.key"
      mode: "0600"

- name: Create or update RabbitMQ TLS secret
  ansible.builtin.shell: |
    kubectl create secret tls {{ rabbitmq_tls_secret_name }} \
      --cert={{ rabbitmq_cert_dir }}/{{ rabbitmq_host }}.crt \
      --key={{ rabbitmq_cert_dir }}/{{ rabbitmq_host }}.key \
      -n {{ rabbitmq_namespace }} \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  changed_when: true

- name: Create RabbitMQ ingress template
  become: true
  ansible.builtin.copy:
    dest: "{{ rabbitmq_config_dir }}/helm_chart/templates/rabbitmq-ingress.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    content: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: rabbitmq-ingress
        namespace: {{ rabbitmq_namespace }}
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
      spec:
        ingressClassName: traefik
        tls:
          - hosts:
              - {{ rabbitmq_host }}
            secretName: {{ rabbitmq_tls_secret_name }}
        rules:
          - host: {{ rabbitmq_host }}
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: {{ rabbitmq_service_name }}
                      port:
                        number: {{ rabbitmq_management_port }}

- name: Deploy RabbitMQ ingress
  ansible.builtin.command:
    cmd: >
      helm upgrade --install {{ rabbitmq_ingress_release_name }} {{ rabbitmq_config_dir }}/helm_chart
      --namespace {{ rabbitmq_namespace }}
      --create-namespace
      --wait
      --timeout 5m
      --rollback-on-failure
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"

- name: Fetch RabbitMQ certificate to Mac
  ansible.builtin.fetch:
    src: "{{ rabbitmq_cert_dir }}/{{ rabbitmq_host }}.crt"
    dest: "./certs/{{ rabbitmq_host }}.crt"
    flat: true

- name: Trust RabbitMQ certificate on Mac
  delegate_to: localhost
  become: true
  ansible.builtin.command:
    cmd: >
      security add-trusted-cert -d -r trustRoot
      -k /Library/Keychains/System.keychain
      ./certs/{{ rabbitmq_host }}.crt
  changed_when: true