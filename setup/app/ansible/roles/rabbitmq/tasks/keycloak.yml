---

- name: Create RabbitMQ Keycloak client
  ansible.builtin.include_role:
    name: keycloak_client
  vars:
    operation: install
    keycloak_client:
      client_id: rabbitmq
      name: RabbitMQ
      public: true
      root_url: "{{ rabbitmq_root_url }}"
      redirect_uris:
        - "{{ rabbitmq_root_url }}/js/oidc-oauth/login-callback.html"
      web_origins:
        - "{{ rabbitmq_root_url }}"

- name: Copy Caddy root CA from container to Mac
  ansible.builtin.command:
    cmd: docker cp {{ rabbitmq_caddy_container_name }}:{{ rabbitmq_caddy_root_ca_container_path }} {{ rabbitmq_caddy_root_ca_local_path }}
  delegate_to: localhost
  run_once: true
  changed_when: true

- name: Copy Caddy root CA to Raspberry Pi
  ansible.builtin.copy:
    src: "{{ rabbitmq_caddy_root_ca_local_path }}"
    dest: /tmp/keycloak-caddy-root.crt
    mode: "0644"

- name: Create/update Keycloak Caddy CA secret
  ansible.builtin.shell: |
    kubectl create secret generic keycloak-caddy-ca \
      -n {{ rabbitmq_namespace }} \
      --from-file=caddy-root.crt=/tmp/keycloak-caddy-root.crt \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  changed_when: true

- name: Upgrade RabbitMQ with updated values
  ansible.builtin.command:
    cmd: >
      helm upgrade {{ rabbitmq_release_name }} bitnami/rabbitmq
      -n {{ rabbitmq_namespace }}
      -f {{ rabbitmq_values_file }}
  changed_when: true

- name: Restart RabbitMQ StatefulSet
  ansible.builtin.command:
    cmd: kubectl rollout restart statefulset {{ rabbitmq_release_name }} -n {{ rabbitmq_namespace }}
  changed_when: true

- name: Wait for RabbitMQ rollout
  ansible.builtin.command:
    cmd: kubectl rollout status statefulset {{ rabbitmq_release_name }} -n {{ rabbitmq_namespace }} --timeout=180s
  changed_when: false