- name: Install RabbitMQ using Homebrew
  community.general.homebrew:
    name: "{{ rabbitmq_package }}"
    state: present

- name: Get RabbitMQ Homebrew prefix
  ansible.builtin.command:
    cmd: brew --prefix rabbitmq
  register: rabbitmq_prefix
  changed_when: false

- name: Enable RabbitMQ management plugin
  ansible.builtin.command:
    cmd: >-
      {{ rabbitmq_prefix.stdout }}/sbin/rabbitmq-plugins
      enable rabbitmq_management
  register: rabbitmq_plugin
  changed_when: "'enabled' in rabbitmq_plugin.stdout"

- name: Start RabbitMQ
  ansible.builtin.command:
    cmd: brew services start rabbitmq
  register: rabbitmq_service
  changed_when: "'Successfully started' in rabbitmq_service.stdout"

- name: Wait for RabbitMQ application to become ready
  ansible.builtin.command:
    cmd: >-
      {{ rabbitmq_prefix.stdout }}/sbin/rabbitmqctl
      await_startup --timeout 60
  register: rabbitmq_startup
  retries: 5
  delay: 2
  until: rabbitmq_startup.rc == 0
  changed_when: false

- name: Get existing RabbitMQ users
  ansible.builtin.command:
    cmd: >-
      {{ rabbitmq_prefix.stdout }}/sbin/rabbitmqctl
      list_users --no-table-headers
  register: rabbitmq_users
  changed_when: false

- name: Create RabbitMQ admin user
  ansible.builtin.command:
    cmd: >-
      {{ rabbitmq_prefix.stdout }}/sbin/rabbitmqctl
      add_user {{ rabbitmq_user }} {{ rabbitmq_password }}
  when: >
    rabbitmq_users.stdout_lines
    | select('match', '^' ~ rabbitmq_user ~ '\\s')
    | list
    | length == 0
  no_log: true

- name: Set RabbitMQ admin user tags
  ansible.builtin.command:
    cmd: >-
      {{ rabbitmq_prefix.stdout }}/sbin/rabbitmqctl
      set_user_tags {{ rabbitmq_user }} administrator
  changed_when: false

- name: Set RabbitMQ admin permissions
  ansible.builtin.command:
    cmd: >-
      {{ rabbitmq_prefix.stdout }}/sbin/rabbitmqctl
      set_permissions -p /
      {{ rabbitmq_user }}
      ".*" ".*" ".*"
  changed_when: false