---

- name: Ensure parent directory exists
  ansible.builtin.file:
    path: "{{ deploy_helm_charts_folder }}"
    state: directory
    mode: "0755"

- name: Copy Helm charts for digital twin apps to ec2
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../helm-chart/digital-twin/"
    dest: "{{ deploy_helm_charts_folder }}/"
    recursive: true
    rsync_opts:
      - "--rsh='ssh -i ~/Documents/Technical/AWS/SSH/MyEC2KeyPair.pem -o StrictHostKeyChecking=no'"
  when: "'aws_server' in group_names"
  delegate_to: localhost

- name: Copy Helm charts for digital twin apps
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../helm-chart/digital-twin/"
    dest: "{{ deploy_helm_charts_folder }}/"
    recursive: true
  when: "'aws_server' not in group_names"
  delegate_to: localhost

- name: Ensure correct owner and group
  file:
    path: "{{ deploy_helm_charts_folder }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: true

- name: Set ECR Secret to false for non-EC2
  set_fact:
    ecr_enabled: false
  when: "'aws_server' not in group_names"

- name: Set ECR Secret to true for EC2
  set_fact:
    ecr_enabled: true
  when: "'aws_server' in group_names"

- name: Configure k3s to use local registry
  become: true
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/registries.yaml
    content: |
      mirrors:
        "{{ deploy_helm_nexus_repo }}":
          endpoint:
            - "http://{{ deploy_helm_nexus_repo }}"
    mode: '0644'

- name: Ensure k3s is running
  become: true
  ansible.builtin.systemd:
    name: k3s
    state: restarted
    enabled: true

- name: Deploy digital twin application services
  ansible.builtin.command:
    cmd: helm upgrade --install {{ deploy_helm_dt_release }} {{ deploy_helm_charts_folder }}
         --namespace {{ deploy_helm_dt_namespace }} --create-namespace --wait --timeout 15m --rollback-on-failure
         --set ecr_setup.enabled={{ ecr_enabled }}
         --set backend.containers.api_service.image={{ deploy_helm_nexus_repo }}/api-service
         --set backend.containers.edge_server.image={{ deploy_helm_nexus_repo }}/edge-server
         --set frontend.containers.app.image={{ deploy_helm_nexus_repo }}/digital-twin-app
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
