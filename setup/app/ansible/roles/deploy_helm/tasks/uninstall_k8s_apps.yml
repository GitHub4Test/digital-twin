---

- name: Uninstall release '{{ deploy_helm_dt_release }}' in namespace '{{ deploy_helm_dt_namespace }}'
  ansible.builtin.command:
    cmd: helm uninstall {{ deploy_helm_dt_release }} -n {{ deploy_helm_dt_namespace }}
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  ignore_errors: true

- name: Remove helm charts directory
  ansible.builtin.file:
    path: "{{ deploy_helm_charts_folder }}"
    state: absent
