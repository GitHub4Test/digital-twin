name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/ci.yml"

  pull_request:
    paths:
      - "apps/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    name: Test ${{ matrix.service_name }}
    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: api-gateway
            service_path: apps/backend/api-gateway

          - service_name: edge-server
            service_path: apps/backend/edge-server

          - service_name: digital-twin-app
            service_path: apps/frontend/digital-twin-app

    defaults:
      run:
        working-directory: ${{ matrix.service_path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.14"

      - name: Check Python
        run: |
          python3 --version
          which python3

      - name: Install Poetry
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install poetry

      - name: Configure Poetry
        run: |
          poetry env use python3
          poetry config virtualenvs.in-project true

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-${{ hashFiles(format('{0}/poetry.lock', matrix.service_path)) }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        run: |
          poetry lock
          poetry install --no-interaction --no-root

      - name: Install project package
        run: |
          poetry install --no-interaction

      - name: Generate protos           
        run: |
          ../../../scripts/protos/generateprotos.sh

      - name: Git Diff # fails if generated code is out of sync with .proto                    
        run: |
          git diff --exit-code             

      - name: Run SAST
        run: |
          ../../../scripts/security/run-semgrep.sh .

      - name: Run Dependency Scan
        run: |
          ../../../scripts/security/run-pip-audit.sh .

      - name: Run tests
        run: |
          poetry run pytest tests -v