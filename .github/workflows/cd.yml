name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

  workflow_dispatch:

jobs:

  ########################################################
  # Build and push python packages and docker images to Nexus
  ########################################################
  build-push:
    name: Build and push ${{ matrix.service_path }}
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        include:
          - service_path: apps/backend

          - service_path: apps/frontend

    steps:
      - uses: actions/checkout@v4

      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.14"

      - name: Check Python
        run: |
          python3 --version
          which python3

      - name: Install Poetry
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install poetry

      - name: Build and push package/image
        working-directory: ${{ matrix.service_path }}
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}        
        run: |
          chmod +x build/build_and_push_nexus.sh
          ./build/build_and_push_nexus.sh

      - name: Cleanup Docker cache
        if: always()
        run: |
          docker system prune -af || true

  ########################################################
  # Deploy to k3s using Ansible
  ########################################################
  deploy:
    runs-on: self-hosted
    needs: build-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install kubernetes.core
          
      - name: Deploy microservices
        working-directory: setup/app/ansible
        run: |
          ansible-playbook \
            playbooks/apps.yml \
            -i hosts \
            -t install